<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>KPI Card - Configure</title>
<script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  :root{
    --ink:#1a1a2e; --muted:#6b7280; --line:#e5e7eb; --accent:#4F46E5; --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    margin:0; padding:20px; color:var(--ink); background:var(--bg); font-size:13px;
  }
  h2{font-size:16px; margin:0 0 16px 0; font-weight:700;}
  .field{margin-bottom:14px;}
  label{display:block; font-weight:600; margin-bottom:5px; font-size:12px; color:var(--ink);}
  .hint{color:var(--muted); font-size:11px; margin-top:3px;}
  select, input[type=text]{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; background:#fff; color:var(--ink);
  }
  select:focus, input:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .radio-group{display:flex; gap:14px; margin-top:4px;}
  .radio-group label{font-weight:400; display:flex; align-items:center; gap:5px; margin-bottom:0;}
  fieldset{border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px;}
  legend{font-weight:700; font-size:12px; padding:0 6px;}
  .footer{
    position:sticky; bottom:0; background:#fff; padding-top:12px; margin-top:6px;
    display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--line);
  }
  button{
    padding:8px 16px; border-radius:6px; border:1px solid var(--line); background:#fff;
    font-size:13px; cursor:pointer; font-weight:600;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:disabled{opacity:.5; cursor:not-allowed;}
  #error{color:#dc2626; font-size:12px; margin-top:8px; display:none;}
</style>
</head>
<body>
  <h2>Configure KPI Card</h2>

  <fieldset>
    <legend>Data</legend>
    <div class="field">
      <label for="worksheet">Worksheet</label>
      <select id="worksheet"></select>
      <div class="hint">The worksheet this card reads its data from.</div>
    </div>
    <div class="row">
      <div class="field">
        <label for="dateField">Date field</label>
        <select id="dateField"></select>
      </div>
      <div class="field">
        <label for="kpiField">KPI field</label>
        <select id="kpiField"></select>
      </div>
    </div>
    <div class="field">
      <label for="agg">Aggregation</label>
      <select id="agg">
        <option value="sum">Sum</option>
        <option value="avg">Average</option>
        <option value="last">Last value in period</option>
      </select>
      <div class="hint">How values are rolled up per period, and how the current KPI value is calculated.</div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Card text</legend>
    <div class="field">
      <label for="title">Card title</label>
      <input type="text" id="title" placeholder="e.g. Sales" />
    </div>
    <div class="row">
      <div class="field">
        <label for="prefix">Value prefix</label>
        <input type="text" id="prefix" placeholder="e.g. $" />
      </div>
      <div class="field">
        <label for="suffix">Value suffix</label>
        <input type="text" id="suffix" placeholder="e.g. units" />
      </div>
    </div>
    <div class="field">
      <label for="decimals">Decimal places</label>
      <select id="decimals">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend>Comparison period</legend>
    <div class="field">
      <label>Compare current period vs.</label>
      <div class="radio-group">
        <label><input type="radio" name="period" value="month" /> Previous Month</label>
        <label><input type="radio" name="period" value="quarter" /> Previous Quarter</label>
        <label><input type="radio" name="period" value="year" /> Previous Year</label>
      </div>
      <div class="hint">Also controls how the trend chart below groups the data.</div>
    </div>
  </fieldset>

  <div id="error"></div>

  <div class="footer">
    <button id="cancelBtn">Cancel</button>
    <button id="saveBtn" class="primary">Save</button>
  </div>

<script>
let worksheetsByName = {};

function showError(msg){
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function populateFieldDropdowns(worksheetName){
  const dateSel = document.getElementById('dateField');
  const kpiSel = document.getElementById('kpiField');
  dateSel.innerHTML = '';
  kpiSel.innerHTML = '';
  const worksheet = worksheetsByName[worksheetName];
  if(!worksheet) return;
  try{
    const summary = await worksheet.getSummaryDataAsync({ maxRows: 1, ignoreSelection: true });
    summary.columns.forEach(col => {
      const optD = document.createElement('option');
      optD.value = col.fieldName; optD.textContent = col.fieldName;
      dateSel.appendChild(optD);
      const optK = document.createElement('option');
      optK.value = col.fieldName; optK.textContent = col.fieldName;
      kpiSel.appendChild(optK);
    });
  } catch(e){
    showError('Could not read fields from this worksheet: ' + e.message);
  }
}

async function init(){
  await tableau.extensions.initializeDialogAsync();

  const dashboard = tableau.extensions.dashboardContent.dashboard;
  dashboard.worksheets.forEach(ws => worksheetsByName[ws.name] = ws);

  const wsSel = document.getElementById('worksheet');
  dashboard.worksheets.forEach(ws => {
    const opt = document.createElement('option');
    opt.value = ws.name; opt.textContent = ws.name;
    wsSel.appendChild(opt);
  });

  const settings = tableau.extensions.settings.getAll();

  if (dashboard.worksheets.length > 0) {
    const initialWs = settings.worksheet && worksheetsByName[settings.worksheet]
      ? settings.worksheet : dashboard.worksheets[0].name;
    wsSel.value = initialWs;
    await populateFieldDropdowns(initialWs);
  }

  if (settings.dateField) document.getElementById('dateField').value = settings.dateField;
  if (settings.kpiField) document.getElementById('kpiField').value = settings.kpiField;
  document.getElementById('agg').value = settings.agg || 'sum';
  document.getElementById('title').value = settings.title || 'Sales';
  document.getElementById('prefix').value = settings.prefix || '';
  document.getElementById('suffix').value = settings.suffix || '';
  document.getElementById('decimals').value = settings.decimals || '0';
  const period = settings.period || 'month';
  document.querySelector(`input[name="period"][value="${period}"]`).checked = true;

  wsSel.addEventListener('change', () => populateFieldDropdowns(wsSel.value));

  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('cancelBtn').addEventListener('click', () => {
    tableau.extensions.ui.closeDialog('cancelled');
  });
}

function save(){
  const worksheet = document.getElementById('worksheet').value;
  const dateField = document.getElementById('dateField').value;
  const kpiField = document.getElementById('kpiField').value;

  if(!worksheet || !dateField || !kpiField){
    showError('Please select a worksheet, date field, and KPI field.');
    return;
  }
  if(dateField === kpiField){
    showError('Date field and KPI field must be different.');
    return;
  }

  const period = document.querySelector('input[name="period"]:checked').value;

  tableau.extensions.settings.set('worksheet', worksheet);
  tableau.extensions.settings.set('dateField', dateField);
  tableau.extensions.settings.set('kpiField', kpiField);
  tableau.extensions.settings.set('agg', document.getElementById('agg').value);
  tableau.extensions.settings.set('title', document.getElementById('title').value || 'KPI');
  tableau.extensions.settings.set('prefix', document.getElementById('prefix').value);
  tableau.extensions.settings.set('suffix', document.getElementById('suffix').value);
  tableau.extensions.settings.set('decimals', document.getElementById('decimals').value);
  tableau.extensions.settings.set('period', period);

  tableau.extensions.settings.saveAsync().then(() => {
    tableau.extensions.ui.closeDialog('saved');
  }).catch(e => showError('Save failed: ' + e.message));
}

init().catch(e => showError('Init failed: ' + e.message));
</script>
</body>
</html>
